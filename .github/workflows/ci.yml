name: Sonavi cross-platform checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            package-command: npm run build:win
          - name: macOS Intel x64
            os: macos-15-intel
            package-command: npm run build:mac:x64
          - name: macOS Apple Silicon arm64
            os: macos-15
            package-command: npm run build:mac:arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use project Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests
        run: npm test

      - name: Electron smoke
        run: npm run test:e2e

      - name: Build platform package without publishing
        run: ${{ matrix.package-command }}
