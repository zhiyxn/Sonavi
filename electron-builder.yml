appId: com.sonavi.desktop
productName: Sonavi
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: release/${version}
files:
  - out/**
  - package.json
extraResources:
  - from: build/icon.png
    to: icon.png
asar: true
compression: normal
removePackageScripts: true
publish: null

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
  verifyUpdateCodeSignature: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

mac:
  icon: build/icon.png
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.music
  minimumSystemVersion: "13.0"
  hardenedRuntime: true
  gatekeeperAssess: false

dmg:
  sign: false
